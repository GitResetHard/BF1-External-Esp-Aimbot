name: Windows x64 drawing and UI checks

on:
  push:
    branches: [main, fix/optional-mouse-backend-20261025]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the patched source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebuild Windows x64 Release
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild with C++ tools was not found.' }
          "MSBUILD_PATH=$msbuild" | Add-Content $env:GITHUB_ENV
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts\BF1-Windows-x64-drawing-v2'
          $intermediate = Join-Path $env:GITHUB_WORKSPACE '.build\Release-x64'
          New-Item -ItemType Directory -Force -Path $output, $intermediate | Out-Null
          $buildLog = Join-Path $output 'build.log'
          $binaryLog = Join-Path $output 'build.binlog'
          & $msbuild BF1_External.sln /t:Rebuild /m /nologo /p:Configuration=Release /p:Platform=x64 "/p:OutDir=$output\" "/p:IntDir=$intermediate\" "/bl:$binaryLog" "/flp:logfile=$buildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "Application build failed: $LASTEXITCODE" }
          $exe = Join-Path $output 'BF1_External.exe'
          if (-not (Test-Path $exe)) { throw 'Expected executable is missing.' }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BF1_External.exe" | Set-Content (Join-Path $output 'SHA256SUMS.txt') -Encoding utf8
          @(
            'BF1 drawing repairs and diagnostics v2',
            "Source commit: $env:GITHUB_SHA",
            'Configuration: Release | x64; v143; C++17.',
            'Actual overlay implementation changed: checked projections, finite/bounded geometry, clamped health bars.',
            'Drawing uses the background draw list rather than a full-screen ImGui window.',
            'Local-player identification precedes team filtering; stale local state is cleared each frame.',
            'Name reads are bounded and terminated; failed reads are reported.',
            'Local player name defaults to HQuserTR_61; this is not an enemy-name selector.',
            'Missing Logitech input remains optional; no replacement automated input backend was added.',
            'The original game addresses and original player-lookup implementation are unchanged.',
            'This is NOT a verified fix for compatibility with the installed game version.',
            'Tests check actual marker draw commands with synthetic screen-space data, not real game entities or GPU pixels.',
            '18 drawing cases run in each backend test, followed by 180 UI frames and failed-read reporting checks.',
            'Extract into a new writable folder and launch BF1_External.exe instead of an older copy.',
            'The header reads BF1 drawing diagnostics v2. Delete opens the menu after initialization.',
            'Use Synthetic drawing test to show a clearly labelled fake marker independent of game data.',
            'If real markers remain missing, attach BF1-diagnostics.txt generated beside the executable.',
            'The file records counts, first failing stage, and Win32 read error; it contains no player-name list.',
            'Do not install unverified drivers or disable security protections to run this build.',
            'Read regression-missing.log and regression-available.log for actual results.',
            "Executable SHA256: $hash"
          ) | Set-Content (Join-Path $output 'BUILD-INFO.txt') -Encoding utf8
          git diff a32737920d5653fed4dc624b5db7ae04ec601803 HEAD -- R5Reloaded_External tests .github | Set-Content (Join-Path $output 'source-changes.patch') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate source patch.' }
          "### Application build succeeded`nSource: $env:GITHUB_SHA`nSHA256: $hash`nNot tested against a running game." | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Build and run marker and UI regression tests
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts\BF1-Windows-x64-drawing-v2'
          $testOutput = Join-Path $env:GITHUB_WORKSPACE '.build\tests\out'
          $testIntermediate = Join-Path $env:GITHUB_WORKSPACE '.build\tests\obj'
          New-Item -ItemType Directory -Force -Path $testOutput, $testIntermediate | Out-Null
          $testBuildLog = Join-Path $output 'regression-build.log'
          & $env:MSBUILD_PATH tests\optional_mouse_backend_test.vcxproj /t:Rebuild /m /nologo /p:Configuration=Release /p:Platform=x64 "/p:OutDir=$testOutput\" "/p:IntDir=$testIntermediate\" "/flp:logfile=$testBuildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "Regression test build failed: $LASTEXITCODE" }
          $testExe = Join-Path $testOutput 'optional_mouse_backend_test.exe'
          foreach ($case in @('missing', 'available')) {
            $stdout = Join-Path $output "regression-$case.log"
            $stderr = Join-Path $output "regression-$case.stderr.log"
            $process = Start-Process -FilePath $testExe -ArgumentList $case -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(30000)) {
              & taskkill /PID $process.Id /T /F
              throw "Regression $case timed out."
            }
            $process.WaitForExit()
            $process.Refresh()
            Get-Content $stdout
            Get-Content $stderr
            if ($process.ExitCode -ne 0) { throw "Regression $case failed: $($process.ExitCode)" }
          }
          'Passed: 18 marker cases per mock-backend case, 180 UI frames per case, and failed-read reporting. Live game compatibility is unverified.' | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload executable and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BF1-Windows-x64-drawing-v2
          path: artifacts/BF1-Windows-x64-drawing-v2/
          if-no-files-found: error
          retention-days: 7
